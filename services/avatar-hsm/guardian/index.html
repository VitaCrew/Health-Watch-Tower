<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153b34">
<link rel="manifest" href="/manifest.webmanifest">
<title>보호자 안부 확인</title>
<style>
  body { margin: 0; background: #f1f7f4; color: #153b34; font: 17px system-ui, sans-serif; }
  main { max-width: 30rem; margin: 0 auto; padding: 3rem 1.25rem; }
  section { background: white; border: 1px solid #b9d1c9; padding: 1.25rem; border-radius: 1rem; margin-top: 1rem; }
  button, input { box-sizing: border-box; width: 100%; min-height: 3rem; font: inherit; border-radius: .55rem; }
  input { padding: .6rem; border: 1px solid #687e76; margin: .5rem 0; }
  button { background: #153b34; color: white; border: 0; padding: .6rem; cursor: pointer; }
  button:disabled { opacity: .55; }
</style>
<main>
  <h1>보호자 안부 확인</h1>
  <section id="setup">
    <label for="code">보호자 등록 코드</label>
    <input id="code" type="password" autocomplete="off" spellcheck="false">
    <button id="subscribe" type="button">알림 받기</button>
    <p>아이폰에서는 이 화면을 홈 화면에 추가한 뒤 알림을 켜 주세요.</p>
  </section>
  <section id="alert" hidden>
    <h2>안부 확인 요청</h2>
    <p id="when"></p>
    <button id="confirm" type="button">제가 확인할게요</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="/app.js" defer></script>
</html>
