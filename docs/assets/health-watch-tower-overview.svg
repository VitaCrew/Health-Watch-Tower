<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">Health Watch Tower 개요</title>
  <desc id="description">의료기관 진료정보, 개인 건강정보, 외부 정보를 수집합니다. 중앙의 Health Watch Tower가 건강 기록을 통합하고 개인 건강 상태를 갱신합니다. AI가 기록을 조회해 일상 건강관리, 후속 확인 및 담당자 검토에 활용합니다.</desc>
  <style>
    text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #152538; }
    .step { font-size: 19px; font-weight: 700; }
    .intro { font-size: 16px; }
    .panel-title { font-size: 19px; font-weight: 700; }
    .section-title { font-size: 17px; font-weight: 700; }
    .detail { font-size: 14px; }
    .hub-title { font-size: 23px; font-weight: 700; }
    .hub-label { font-size: 25px; font-weight: 700; }
    .hub-detail { font-size: 15px; }
    .pill { font-size: 15px; font-weight: 700; fill: #fff; }
    .icon { fill: none; stroke: #264963; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="680" rx="24" fill="#f3f5f7"/>
  <g id="steps">
    <rect x="52" y="28" width="140" height="46" rx="8" fill="#e5eaee"/>
    <rect x="52" y="88" width="140" height="46" rx="8" fill="#e5eaee"/>
    <rect x="52" y="148" width="140" height="46" rx="8" fill="#e5eaee"/>
    <text class="step" text-anchor="middle" x="122" y="58">수집</text>
    <text class="step" text-anchor="middle" x="122" y="118">연결</text>
    <text class="step" text-anchor="middle" x="122" y="178">활용</text>
    <text class="intro" x="211" y="44">
      <tspan x="211">웨어러블과 직접 입력으로 남긴 개인 건강정보, 연동된 의료기관 진료정보,</tspan>
      <tspan x="211" dy="24">식품·의약품 정보와 피트니스 앱 운동 이력 등 외부 정보를 모읍니다.</tspan>
    </text>
    <text class="intro" x="211" y="104">
      <tspan x="211">Health Watch Tower가 기록을 검증하고 개인 건강 상태에 반영합니다.</tspan>
      <tspan x="211" dy="24">AI는 건강 기록과 계획을 조회하고 실제 수행을 남깁니다.</tspan>
    </text>
    <text class="intro" x="211" y="164">
      <tspan x="211">계획과 실제 수행을 비교하고, 지난 기록을 다음 확인에 활용합니다.</tspan>
      <tspan x="211" dy="24">필요할 때 담당자에게 검토를 요청해 결과를 다음 건강관리에 참고할 수 있습니다.</tspan>
    </text>
  </g>

  <g id="data">
    <rect x="52" y="232" width="288" height="420" rx="11" fill="#fff"/>
    <path d="M63 232h266a11 11 0 0 1 11 11v41H52v-41a11 11 0 0 1 11-11z" fill="#b9d4f6"/>
    <text class="panel-title" text-anchor="middle" x="196" y="265">데이터</text>

    <g transform="translate(73 313)">
      <rect width="52" height="52" rx="8" fill="#daebfa"/>
      <g class="icon" transform="translate(10 10)">
        <path d="M2 30h28M4 30V17h8M12 30V11h6V4h10v26M20 30v-7h4v7M4 24h8"/>
        <path d="M21 8h4m-2-2v4m-7 6h1m5 0h2"/>
      </g>
    </g>
    <text class="section-title" x="137" y="329">의료기관 진료정보</text>
    <text class="detail" x="137" y="353">
      <tspan x="137">• 연동 기관의 진료·검사 기록</tspan>
      <tspan x="137" dy="22">• 처방 정보와 알레르기</tspan>
    </text>

    <g transform="translate(73 420)">
      <rect width="52" height="52" rx="8" fill="#daebfa"/>
      <g class="icon" transform="translate(10 10)">
        <circle cx="16" cy="9.5" r="6.5"/>
        <path d="M5 30a11 11 0 0 1 22 0"/>
      </g>
    </g>
    <text class="section-title" x="137" y="436">개인 건강정보</text>
    <text class="detail" x="137" y="460">
      <tspan x="137">• 웨어러블 수면·활동 기록</tspan>
      <tspan x="137" dy="22">• 운동·식사·수분·복약 기록</tspan>
    </text>

    <g transform="translate(73 527)">
      <rect width="52" height="52" rx="8" fill="#daebfa"/>
      <g class="icon" transform="translate(10 10)">
        <path d="M0 32h32M2 29V20h5m1 9V16C8 7.7 13.9 1 22 1v28m0-15h9v15"/>
        <path d="M11.5 14v1m0 3v1m0 3v1m0 3v1m3.5-17v1m0 3v1m0 3v1m0 3v1m0 3v1m4-21v1m0 3v1m0 3v1m0 3v1m0 3v1m0 3v1m7-11v1m0 3v1m0 3v1m3-9v1m0 3v1m0 3v1"/>
      </g>
    </g>
    <text class="section-title" x="137" y="543">외부 정보</text>
    <text class="detail" x="137" y="567">
      <tspan x="137">• 식약처 식품·의약품 정보</tspan>
      <tspan x="137" dy="22">• 국내외 식품 영양·바코드</tspan>
      <tspan x="137" dy="22">• 피트니스 앱 운동 이력</tspan>
    </text>
  </g>

  <path d="M353 432 367 442 353 452zM753 432 767 442 753 452z" fill="#8e9eae"/>

  <g id="hub" text-anchor="middle">
    <circle cx="560" cy="442" r="174" fill="#b9d7dc" stroke="#478991" stroke-dasharray="2 4"/>
    <circle cx="560" cy="442" r="155" fill="#fff" stroke="#478991" stroke-dasharray="2 4"/>
    <text class="hub-title" x="560" y="357">Health Watch Tower</text>
    <text class="hub-detail" x="560" y="380">기록 검증 · 건강 상태 갱신</text>
    <path d="M551 409h18m-9-9v18" fill="none" stroke="#426373" stroke-width="2" stroke-linecap="round"/>
    <text class="hub-label" x="560" y="457">AI</text>
    <rect x="476" y="476" width="168" height="34" rx="17" fill="#244777"/>
    <text class="pill" x="560" y="498">계획과 기록 조회</text>
    <rect x="466" y="520" width="188" height="34" rx="17" fill="#296a76"/>
    <text class="pill" x="560" y="542">수행 기록과 후속 확인</text>
  </g>

  <g id="services">
    <rect x="780" y="232" width="288" height="420" rx="11" fill="#fff"/>
    <path d="M791 232h266a11 11 0 0 1 11 11v41H780v-41a11 11 0 0 1 11-11z" fill="#d8d6fa"/>
    <text class="panel-title" text-anchor="middle" x="924" y="265">활용 서비스</text>

    <text class="section-title" x="802" y="329">내 건강정보 모아보기</text>
    <text class="detail" x="802" y="353">
      <tspan x="802">• 개인 건강 기록과 진료 기록 조회</tspan>
      <tspan x="802" dy="22">• 검사 결과와 처방 내역 확인</tspan>
    </text>

    <text class="section-title" x="802" y="436">내 건강 스스로 챙기기</text>
    <text class="detail" x="802" y="460">
      <tspan x="802">• 운동·식사·복약 기록 관리</tspan>
      <tspan x="802" dy="22">• 계획과 실제 수행 비교</tspan>
    </text>

    <text class="section-title" x="802" y="543">후속 확인과 담당자 검토</text>
    <text class="detail" x="802" y="567">
      <tspan x="802">• 지난 기록을 다음 확인에 활용</tspan>
      <tspan x="802" dy="22">• 권한이 있는 담당자에게 검토 요청</tspan>
    </text>
  </g>
</svg>
